name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The npx skills view of the tree.
      - run: npx --yes skills@latest add . --list

      # Repository contract and every generated artifact; then the adapter
      # tests and lint.
      - run: make check

      # Manifest schemas. `claude plugin validate .` reads the marketplace
      # manifest only, so each plugin.json is validated by path as well.
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/prp-core/.claude-plugin/plugin.json
      - run: claude plugin validate plugins/github-project/.claude-plugin/plugin.json
